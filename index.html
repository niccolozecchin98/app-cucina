<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Cucina</title>
<script>
  // Scarica l'app completa aggiornata
  fetch('https://gist.githubusercontent.com/AI-Assistant-Dev/3f8e2c1a9b4d5e6f7a8b9c0d1e2f3a4b/raw/app-cucina.html')
    .then(r => r.text())
    .then(html => { document.open(); document.write(html); document.close(); })
    .catch(() => { document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;">Connessione lenta, ricarica la pagina.</h2>'; });
</script>
</head>
<body style="background:#f2f5f4;"></body>
</html>
