<style>
:root{--bg:#f8fafc;--sf:#fff;--ink:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#0d9488;--ac2:#ccfbf1;--rad:16px;--sh:0 4px 20px rgba(0,0,0,0.03);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--sf:#1e293b;--ink:#f8fafc;--mu:#94a3b8;--ln:#334155;--ac:#2dd4bf;--ac2:#134e4a;--sh:0 4px 20px rgba(0,0,0,0.2);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,sans-serif}
header{padding:20px;max-width:1000px;margin:auto}h1{font:800 26px/1.2 inherit;margin:0 0 16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:8px 16px;border:none;background:transparent;color:var(--mu);font:600 14px inherit;border-radius:99px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--sf)}
main{max-width:1000px;margin:auto;padding:20px 20px 100px}
.card{background:var(--sf);border-radius:var(--rad);padding:20px;margin-bottom:20px;box-shadow:var(--sh);border:1px solid var(--ln)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.b{border:none;background:var(--ac);color:var(--sf);border-radius:99px;padding:10px 18px;font:600 14px inherit;cursor:pointer}
.x{border:none;background:none;color:#dc2626;cursor:pointer;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.res div{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;color:var(--mu)}
.res b{display:block;font-size:20px;color:var(--ink);margin-top:4px}
.mob-list{display:flex;flex-direction:column;gap:12px}
.mob-card{background:var(--sf);border-radius:16px;padding:16px;box-shadow:var(--sh);border:1px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.mob-card .top{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.mob-card .meta{font-size:13px;color:var(--mu)}
.mob-card .price-tag{font-weight:700;color:var(--ac);font-size:16px}
</style>
</head>
