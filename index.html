<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costo piatto e preventivi menù</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; font-family: sans-serif; }
</style>
</head>
<body>
  <h2>Caricamento in corso...</h2>
  <script>
    // Questo script scarica l'app completa (con la nuova UI Wow) e la avvia
    fetch('https://raw.githubusercontent.com/AI-Cucina-App/main/app.html')
      .then(r => r.text())
      .then(html => { document.open(); document.write(html); document.close(); })
      .catch(() => { 
        document.body.innerHTML = '<h2>Errore di caricamento. Riprova tra un minuto.</h2>'; 
      });
  </script>
</body>
</html>
