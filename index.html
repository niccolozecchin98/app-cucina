  if(!i)return Object.assign(o,guess(r),{st:"new",sel:true});
  const old=i.p*(1-i.sc/100);Object.assign(o,{id:i.id,old,n:i.n});
  o.st=i.dt&&i.dt>dt?"old":i.um.toUpperCase()!=r.um?"um":Math.abs(net-old)<0.005?"same":net>old?"up":"down";

async function readPdf(fl){
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
 const pdf=await pdfjsLib.getDocument({data:await fl.arrayBuffer()}).promise,rows=[];let all="";
 for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p),W=pg.getViewport({scale:1}).width,tc=await pg.getTextContent();
  const it=tc.items.map(t=>({s:t.str.trim(),x:t.transform[4]/W,y:t.transform[5]})).filter(t=>t.s);
  const pt=it.map(t=>t.s).join(" ");all+=pt+" ";const dmax=/DOCUMENTO DI TRASPORTO/.test(pt)?0.57:0.455;it.sort((a,b)=>b.y-a.y);const G=[];
  it.forEach(t=>{const g=G.find(g=>Math.abs(g.y-t.y)<3);g?g.t.push(t):G.push({y:t.y,t:[t]})});
  G.forEach(g=>{g.t.sort((a,b)=>a.x-b.x);const c=g.t[0];if(c.x>0.11||!/^\d{4,6}$/.test(c.s))return;
   const ln=g.t.map(t=>t.s).join(" "),m=ln.match(TAIL)||ln.match(TAILD);if(!m)return;
   rows.push({cod:c.s,n:g.t.filter(t=>t.x>0.11&&t.x<dmax).map(t=>t.s).join(" "),um:m[3],p:num(m[4]),sc:num(m[5]||"0")})})}
 if(/DOCUMENTO DI TRASPORTO/.test(all)){const a=all.match(/C\s*\/\s*(\d{4,})/),r=all.match(/del (\d{2})\/(\d{2})\/(\d{4})/)||all.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
  return mk("DDT C/"+(a?a[1]:""),r?`${r[3]}-${r[2]}-${r[1]}`:today(),rows)}
 const no=(all.match(/OCC\/\d+/)||["Bolla"])[0],d=all.match(/\b(\d{2})\/(\d{2})\/(\d{2})\b/);
 return mk(no,d?`20${d[3]}-${d[2]}-${d[1]}`:today(),rows)}

/* calendario */
const MI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"],ME=["January","February","March","April","May","June","July","August","September","October","November","December"];
const addD=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function perTxt(a,b){const x=new Date(a+"T12:00:00"),y=new Date(b+"T12:00:00");if(isNaN(x)||isNaN(y))return["",""];const sm=x.getMonth()==y.getMonth();
 return[sm?`${x.getDate()}-${y.getDate()} ${MI[x.getMonth()]}`:`${x.getDate()} ${MI[x.getMonth()]} - ${y.getDate()} ${MI[y.getMonth()]}`,sm?`${ME[x.getMonth()]} ${x.getDate()}-${y.getDate()}`:`${ME[x.getMonth()]} ${x.getDate()} - ${ME[y.getMonth()]} ${y.getDate()}`]}
let CAL={a:"",b:""};
const calF=(k,v)=>{CAL[k]=v;if(k=="a"&&v&&!CAL.b)CAL.b=addD(v,4);draw()};
function calSave(){const m=S.menus.find(x=>x.tipo=="pranzo");if(!m||!CAL.a||!CAL.b)return alert("Scegli le date.");if(!SEC.some(([k])=>m.sec[k].length))return alert("Il menu pranzo è vuoto.");
 S.cal.push({id:nid(),a:CAL.a,b:CAL.b,sec:JSON.parse(JSON.stringify(m.sec))});S.cal.sort((x,y)=>x.a.localeCompare(y.a));go()}
function calLoad(id){const c=D(S.cal,id),m=S.menus.find(x=>x.tipo=="pranzo");if(!m||!confirm("Caricare questa settimana nel menu pranzo? Il menù attuale verrà sostituito (archivialo prima se ti serve)."))return;
 m.sec=JSON.parse(JSON.stringify(c.sec));[m.per,m.pe]=perTxt(c.a,c.b);m.pz={};FM="Menu pranzo";go()}
const delCal=id=>{if(confirm("Eliminare?")){S.cal=S.cal.filter(x=>x.id!=id);go()}};
function vCal(){const t=today();
 return `<p class="hint">Programma le settimane future: compila il menu pranzo, scegli le date e salvalo qui. Quando arriva il momento lo carichi nel menu pranzo con un tocco.</p><div class="card"><div class="row"><label>Dal<input type="date" value="${CAL.a}" onchange="calF('a',this.value)"></label><label>Al<input type="date" value="${CAL.b}" onchange="calF('b',this.value)"></label></div><button class="b" onclick="calSave()">Salva il menù attuale in queste date</button></div>`+(S.cal.length?S.cal.map(c=>{const past=c.b<t,cur=c.a<=t&&t<=c.b;return `<div class="card" style="${past?"opacity:.6":""}"><div class="row" style="margin:0"><b style="flex:1">${E(perTxt(c.a,c.b)[0])} <span class="hint">${cur?"in corso":past?"passata":"programmata"}</span></b><button class="x" aria-label="Elimina" onclick="delCal(${c.id})">×</button></div><div class="hint">${E(SEC.map(([k])=>c.sec[k].map(id=>dish(id)?dish(id).n:"").filter(Boolean).join(", ")).filter(Boolean).join(" · "))}</div><button class="b g" style="margin-top:6px" onclick="calLoad(${c.id})">Carica nel menu pranzo</button></div>`}).join(""):`<p class="hint">Nessuna settimana programmata.</p>`)}
/* etichette */

const labAl=n=>{const s=n.trim().toLowerCase(),i=S.ing.find(x=>x.n.toLowerCase()==s);if(i)return i.a;const r=S.rec.find(x=>x.n.toLowerCase()==s);if(r)return[...alls(r.l)];const d=S.dishes.find(x=>x.n.toLowerCase()==s);return d?[...dall(d)]:[]};
const labTxt=x=>x.n.toUpperCase()+"\nPreparato: "+fd(x.p)+"\nScade: "+fd(x.s)+(x.op?"\nOperatore: "+x.op:"")+"\nAllergeni: "+nums(x.a);

function vLab(){const x=labCur();
 return `<p class="hint">Crea l’etichetta per un contenitore: scegli il prodotto e i giorni di conservazione. Gli allergeni si compilano da soli se il nome è un ingrediente, una ricetta o un piatto.</p>${dlist()}
 <div class="card"><div class="row"><label class="big">Prodotto<input list="itm" value="${E(LD.n)}" onchange="lf('n',this.value)"></label></div>
 <div class="row"><label>Preparato il<input type="date" value="${LD.p||today()}" onchange="lf('p',this.value)"></label><label>Giorni di conservazione<input inputmode="decimal" value="${LD.g}" style="width:80px" onchange="lf('g',this.value)"></label><label>Operatore<input value="${E(S.nm||"")}" style="width:110px" onchange="lnm(this.value)"></label></div>
 <div class="row">${[1,2,3,5,7].map(v=>`<button class="b g" style="padding:3px 10px" onclick="lf('g',${v})">${v} g</button>`).join("")}</div>
 <div class="pv" style="text-align:left;white-space:pre-line;font-size:15px;margin:8px 0">${E(labTxt(x))}</div>
 <div class="row"><button class="b" data-t="${E(labTxt(x))}" onclick="cp(this.dataset.t)">Copia etichetta</button><button class="b g" onclick="labAdd()">Aggiungi alla lista</button></div></div>`+(S.lab.length?`<p style="margin:12px 0 6px"><b>Lista etichette</b></p>`+S.lab.map((l,j)=>`<div class="card"><div class="row" style="margin:0;flex-wrap:nowrap"><div style="flex:1;white-space:pre-line;font-size:13px">${E(labTxt(l))}</div><button class="x" aria-label="Elimina" onclick="S.lab.splice(${j},1);go()">×</button></div></div>`).join("")+`<div class="row"><button class="b" data-t="${E(S.lab.map(labTxt).join("\n\n"))}" onclick="cp(this.dataset.t)">Copia tutte</button><button class="b g" onclick="if(confirm('Svuotare la lista?')){S.lab=[];go()}">Svuota</button></div>`:"")}

/* assistente: chat con Claude e ponte verso Gemini */
let CH=[],CM="claude",CHO=0,SMP,BUSY=0,GQ="";
const SYS="Sei l’assistente di cucina di un ristorante italiano (Barberia Treviso Tiramisù) e aiuti a creare menù e piatti. Rispondi in italiano, in modo breve e pratico (si legge da telefono). Per i costi usa solo i prezzi del contesto: se manca un ingrediente dillo, non inventare prezzi. Indica sempre gli allergeni (14 allergeni UE) e ricorda di verificarli sulle schede tecniche. Quando proponi un piatto indica gli ingredienti con le quantità in grammi per porzione.";
function ctx(){
 const I=S.ing.filter(i=>i.cat!="Non alimentare").map(i=>`${i.n} | ${i.cat} | ${i.b=="g"?f(cpb(i)*1000)+" €/kg":f(cpb(i))+" €/pz"}${i.a.length?" | allergeni: "+names(i.a):""}`).join("\n");
 const L=l=>l.map(x=>{const t=itm(x);return (t?t.n:x.n)+" "+x.q+(t&&t.k=="i"?t.o.b:"g")}).join(", ")||"–";
 const Rr=S.rec.map(r=>`${r.n}: ${L(r.l)} (resa ${r.y||"–"} g, ${f(rcpg(r)*1000)} €/kg)`).join("\n");
 const Dd=S.dishes.map(d=>`${d.n} [${d.cat}] costo a porzione ${f(dc(d))} €${d.pv?", prezzo "+f(d.pv)+" €":""}; ingredienti: ${L(d.l)}; allergeni: ${names([...dall(d)])||"nessuno"}`).join("\n");
 const P=S.menus.filter(m=>m.tipo=="pranzo").map(m=>`"${m.n}" ${m.per||""}. Formule: ${m.f.map(x=>x.n+" "+x.pr+"€").join("; ")}. `+SEC.map(([s])=>s+": "+(m.sec[s]||[]).map(id=>dish(id)?dish(id).n:"").join("; ")).join(". ")).join("\n");
 return "CONTESTO (dati dell’app; costi netti IVA esclusa, IVA ristorazione 10%)\nINGREDIENTI (nome | categoria | costo | allergeni):\n"+I+"\n\nRICETTE:\n"+(Rr||"nessuna")+"\n\nPIATTI:\n"+(Dd||"nessuno")+"\n\nMENU PRANZO:\n"+(P||"nessuno")}
const fmtc=t=>E(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
async function loadSm(){if(SMP!==undefined)return;try{SMP=await claude.use("sample")}catch(e){SMP=null}if(CHO&&CM=="claude")chMsgs()}

function chShell(){const el=document.getElementById("ch");if(!CHO){el.hidden=true;return}el.hidden=false;
 el.innerHTML=`<div class="chh"><b>Assistente menù</b><span><button class="b g" onclick="CH=[];chShell()" style="padding:4px 8px">Nuova chat</button> <button class="x" onclick="CHO=0;chShell()" aria-label="Chiudi">×</button></span></div>
 <div class="seg">${[["claude","Claude (qui)"],["gemini","Gemini"]].map(c=>`<button class="${c[0]==CM?"on":""}" onclick="chMode('${c[0]}')">${c[1]}</button>`).join("")}</div>`+(CM=="claude"?
 `<div id="cm" class="cm"></div><div class="row" style="flex-wrap:nowrap"><input id="ci" style="flex:1" placeholder="Scrivi un messaggio…" onkeydown="if(event.key=='Enter')chSend()"><button class="b" onclick="chSend()">Invia</button></div>`:
 `<div class="cm"><p class="hint">Gemini non può collegarsi direttamente all’app. Premi il pulsante: l’app copia il tuo menù, i piatti e i prezzi e apre Gemini, dove sei già collegato con il tuo account Google. Poi incolla il testo e invia.</p>

 <div class="row" style="margin-top:8px"><a class="b" style="text-decoration:none" href="https://gemini.google.com/app" target="_blank" rel="noopener" onclick="gCopy()">Copia e apri Gemini</a><button class="b g" onclick="gCopy(1)">Solo copia</button></div>
 <p class="hint">Se Gemini non si apre, aprilo a mano: il testo è già copiato.</p></div>`);
 if(CM=="claude")chMsgs()}
function gCopy(show){const t=SYS+"\n\n"+ctx()+"\n\nDOMANDA:\n"+(GQ.trim()||"Aiutami a creare il menù del pranzo.");
 if(show)return cp(t);try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}}
function chMsgs(){const cm=document.getElementById("cm");if(!cm)return;
 if(SMP===null){cm.innerHTML=`<p class="hint">La chat con Claude non è disponibile su questo account. Usa la scheda Gemini.</p>`;return}
 if(!CH.length){cm.innerHTML=`<p class="hint">Chiedimi idee per piatti e menù: conosco i tuoi ingredienti, i prezzi delle bolle, le ricette e i piatti.</p><div class="sg">${["Proponi 3 primi con gli ingredienti che ho","Idee per un’insalatona nuova","Come abbasso il food cost del menu pranzo?","Controlla gli allergeni dei miei piatti"].map(q=>`<button class="b g" onclick="chSend(this.textContent)">${q}</button>`).join("")}</div>`;return}
 cm.innerHTML=CH.map(m=>`<div class="${m.role=="user"?"bu":"bo"}">${m.content?fmtc(m.content):"…"}</div>`).join("");cm.scrollTop=cm.scrollHeight}
async function chSend(t){const i=document.getElementById("ci");t=(t||(i?i.value:"")).trim();
 if(!t||BUSY)return;if(!SMP){await loadSm();if(!SMP)return}
 if(i)i.value="";CH.push({role:"user",content:t},{role:"assistant",content:""});BUSY=1;chMsgs();
 const msgs=CH.slice(0,-1).map((m,k)=>k==0?{role:"user",content:SYS+"\n\n"+ctx()+"\n\nDOMANDA:\n"+m.content}:m);
 try{const r=await SMP(msgs,{cache:false,onText:({text})=>{CH[CH.length-1].content=text;chMsgs()}});CH[CH.length-1].content=r.text}
 catch(e){CH[CH.length-1].content=e&&e.code=="not_granted"?"Consenso negato: riprova e accetta la richiesta.":"Non riesco a rispondere ora ("+((e&&e.code)||"errore")+"). Riprova tra poco."}
 BUSY=0;chMsgs()}
load();draw();sv();cloudInit();/* --- FUNZIONI DI VISUALIZZAZIONE MANCANTI --- */
const lines=(a,o)=>o.l.map((l,j)=>{const t=itm(l);return `<div class="ln"><input list="itm" class="${l.n&&!t?"er":""}" placeholder="Ingrediente o ricetta…" value="${E(t?t.n:l.n)}" onchange="ul('${a}',${o.id},${j},'n',this.value)"><input inputmode="decimal" value="${l.q}" onchange="ul('${a}',${o.id},${j},'q',this.value)" aria-label="Quantità"><span>${t&&t.k=="i"?t.o.b:"g"} · ${eur(lc(l))}</span><button class="x" aria-label="Rimuovi" onclick="dl('${a}',${o.id},${j})">×</button></div>`}).join("");
